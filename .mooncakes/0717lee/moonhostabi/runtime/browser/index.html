<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoonHostABI Chromium verification</title>
  </head>
  <body>
    <main>
      <output id="result" aria-label="scalar result"></output>
      <output id="externref-identity" aria-label="externref identity"></output>
      <pre id="trace" aria-label="host import trace"></pre>
      <output id="error" aria-label="adapter error"></output>
    </main>
    <script type="module">
      import {
        createHostImports,
        instantiate,
      } from "/dist/generated/adapter.js";

      const resultElement = document.querySelector("#result");
      const identityElement = document.querySelector("#externref-identity");
      const traceElement = document.querySelector("#trace");
      const errorElement = document.querySelector("#error");
      const testCase = new URLSearchParams(location.search).get("case");

      const exportNegativeCases = new Map([
        [
          "missing-roundtrip",
          {
            encoded:
              "AGFzbQEAAAABBwFgAn9/AX8DAgEABwcBA2FkZAAACgkBBwAgACABags=",
            expected:
              "MHA_ADAPTER_MISMATCH: module export exports[roundtrip] must be a function",
          },
        ],
        [
          "renamed-add",
          {
            encoded:
              "AGFzbQEAAAABDAJgAn9/AX9gAW8BbwMDAgABBxsCC3JlbmFtZWQtYWRkAAAJcm91bmR0cmlwAAEKDgIHACAAIAFqCwQAIAAL",
            expected:
              "MHA_ADAPTER_MISMATCH: module export exports[add] must be a function",
          },
        ],
        [
          "non-function-add",
          {
            encoded:
              "AGFzbQEAAAABBgFgAW8BbwMCAQAGBgF/AEEACwcTAgNhZGQDAAlyb3VuZHRyaXAAAAoGAQQAIAAL",
            expected:
              "MHA_ADAPTER_MISMATCH: module export exports[add] must be a function",
          },
        ],
      ]);

      function decodeModule(encoded) {
        return Uint8Array.from(atob(encoded), (character) =>
          character.charCodeAt(0),
        );
      }

      async function expectAdapterMismatch(bytes, imports, expectedMessage) {
        let observed;
        try {
          await instantiate(bytes, imports);
        } catch (error) {
          observed = error;
        }
        if (!(observed instanceof Error)) {
          throw new Error("negative verifier expected an Error");
        }
        if (observed.message !== expectedMessage) {
          throw new Error(
            `negative verifier expected ${JSON.stringify(expectedMessage)}, received ${JSON.stringify(observed.message)}`,
          );
        }
        errorElement.dataset.status = "observed";
        errorElement.textContent = observed.message;
      }

      const exportNegativeCase =
        testCase === null ? undefined : exportNegativeCases.get(testCase);
      const negativeRequested =
        testCase === "negative" || exportNegativeCase !== undefined;

      try {
        const response = await fetch("/fixtures/artifacts/externref.wasm");
        if (!response.ok) {
          throw new Error(`fixture request failed with HTTP ${response.status}`);
        }
        const bytes = await response.arrayBuffer();

        if (testCase === "negative") {
          await expectAdapterMismatch(
            bytes,
            { host: {} },
            "MHA_ADAPTER_MISMATCH: host import imports[host.echo] must be a function",
          );
        } else if (exportNegativeCase !== undefined) {
          const imports = createHostImports();
          imports.host.echo = (argument) => argument;
          await expectAdapterMismatch(
            decodeModule(exportNegativeCase.encoded),
            imports,
            exportNegativeCase.expected,
          );
        } else {
          const token = Object.freeze({ marker: "moonhostabi-browser-token" });
          const trace = [];
          const imports = createHostImports();
          imports.host.echo = (argument) => {
            trace.push(argument);
            return argument;
          };

          const exports = await instantiate(bytes, imports);
          const sum = exports.add(20, 22);
          const returned = exports.roundtrip(token);
          resultElement.textContent = String(sum);
          identityElement.textContent = String(returned === token);
          traceElement.textContent = JSON.stringify({
            count: trace.length,
            argumentIdentity: trace[0] === token,
          });
        }
      } catch (error) {
        errorElement.dataset.status = "verifier-failed";
        errorElement.textContent =
          error instanceof Error ? error.message : String(error);
        if (!negativeRequested) {
          throw error;
        }
      }
    </script>
  </body>
</html>
