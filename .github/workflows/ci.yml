name: Consumer smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MoonBit
        shell: bash
        env:
          MOONBIT_SNAPSHOT: 0.10.11+6ff76a5f9
        run: |
          installer="$RUNNER_TEMP/moonbit-install.sh"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$installer"
          MOONBIT_INSTALL_VERSION="$MOONBIT_SNAPSHOT" bash "$installer"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve and build consumer
        run: |
          moon update
          moon check --deny-warn
          moon test --target native --deny-warn
